name: Publish WonderWhere website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build_website.py'
      - 'AppStore/privacy-policy.md'
      - 'AppStore/support.md'
      - 'CompassDay/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public pages
        run: python3 scripts/build_website.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
